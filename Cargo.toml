[package]
edition = "2024"
name = "rmr_graphql"
version = "0.1.0"

[dependencies]
axum = { version = "0.8" }
async-graphql-axum = { version = "7.0" }
async-graphql = { version = "7.0", features = ["graphiql"] }
dotenv = "0.15.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = { version = "0" }
tracing-subscriber = { version = "0.3.17" }
sea-query = "=1.0.0-rc.22"
sea-query-sqlx = "=0.8.0-rc.9"
sea-orm-migration = { version = "=2.0.0-rc.21", features = ["sqlx-postgres", "runtime-tokio-rustls"] }


[dependencies.sea-orm]
version = "=2.0.0-rc.21"
features = ["sqlx-postgres", "runtime-tokio-native-tls", "seaography", "entity-registry"]

[dependencies.seaography]
version = "~2.0.0-rc.5" # seaography version
features = ["graphql-playground", "with-decimal", "with-chrono"]

[dev-dependencies]
serde_json = { version = "1.0.103" }

[workspace]
members = []

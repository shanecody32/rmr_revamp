[workspace]
members = ["backend", "backend/server"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = []
license = "MIT"

[workspace.dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["fs", "cors"] }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# SeaORM dependencies
sea-orm = { version = "=2.0.0-rc.21", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
sea-orm-migration = { version = "=2.0.0-rc.21", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
sea-query = "=1.0.0-rc.22"
sea-query-sqlx = "=0.8.0-rc.9"

# Seaography dependencies
seaography = "2.0.0-rc.5"
async-graphql = { version = "7.0", features = ["dataloader"] }
async-graphql-axum = "7.0"

# Environment and configuration
dotenvy = "0.15"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

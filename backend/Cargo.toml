[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
axum = "0.8.8"
tokio = { version = "1", features = ["full"] }
sea-orm = { version = "2.0.0-rc.28", features = ["sqlx-mysql", "runtime-tokio-rustls", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["cors", "compression-gzip", "compression-br", "trace"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
utoipa = { version = "5", features = ["axum_extras", "chrono"] }
utoipa-rapidoc = { version = "6", features = ["axum"] }
strsim = "0.11.1"
regex = "1.12.2"
unicode-normalization = "0.1.25"
num2words = "1.2.0"
once_cell = "1.21.3"
futures-util = "0.3.31"
rphonetic = "3.0.6"
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
mime_guess = "2"
tokio-stream = "0.1"
tokio-util = "0.7"

[dev-dependencies]
sea-orm = { version = "2.0.0-rc.28", features = ["sqlx-mysql", "runtime-tokio-rustls", "macros", "mock"] }
tokio = { version = "1", features = ["full", "test-util"] }
pretty_assertions = "1"
